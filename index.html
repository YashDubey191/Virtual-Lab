<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Virtual Lab</title>
  <meta name="description" content="Run college lab experiments in the browser — simulate, record, plot, submit.">

  <!-- Resolved-theme colour for browser chrome. Updated by core.js after boot. -->
  <meta name="theme-color" content="#F2F4F9">

  <!-- First-paint theme: runs before any stylesheet paints, prevents light→dark flash. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('vl.v1');
        var s = raw ? JSON.parse(raw) : {};
        var mode = s.theme || 'auto';
        var h = new Date().getHours();
        var resolved = mode === 'auto'
          ? ((h >= 18 || h < 6) ? 'dark' : 'light')
          : mode;
        document.documentElement.setAttribute('data-theme', resolved);
        var meta = document.querySelector('meta[name="theme-color"]:not([media])');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0B0D14' : '#F2F4F9');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/bg-science.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/screens.css">
    <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/exp-cards.css">
<body>
  <div id="app"></div>
  <div class="toast-region" role="status" aria-live="polite"></div>

  <script defer src="js/core.js"></script>
  <script defer src="js/simulators.js"></script>
  <script defer src="js/student.js"></script>
  <script defer src="js/admin.js"></script>
</body>
</html>
